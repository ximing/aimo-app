name: Build and Release Android

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag vMAJOR.MINOR.PATCH"
        required: true
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if (( minor > 99 || patch > 99 )); then
              echo "::error::minor and patch must be <= 99"
              exit 1
            fi
            version_name="${major}.${minor}.${patch}"
            version_code=$(( major * 10000 + minor * 100 + patch ))
            if (( version_code < 1 )); then
              echo "::error::versionCode must be positive"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
            {
              echo "APP_VERSION_NAME=$version_name"
              echo "APP_VERSION_CODE=$version_code"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Tag '$tag' must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Restore Huawei agconnect config
        env:
          AGCONNECT_SERVICES_JSON_BASE64: ${{ secrets.AGCONNECT_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$AGCONNECT_SERVICES_JSON_BASE64" ]; then
            echo "::error::missing AGCONNECT_SERVICES_JSON_BASE64"
            exit 1
          fi
          printf '%s' "$AGCONNECT_SERVICES_JSON_BASE64" | base64 --decode > agconnect-services.json
          test -s agconnect-services.json

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Restore keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/aimo-release.keystore
          ls -lh android/app/aimo-release.keystore

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Configure JVM memory for Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      - name: Build signed Android APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/aimo-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK_PATH"
          cp "$APK_PATH" app-release.apk
          ls -lh app-release.apk
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile("app-release.apk"); n=b"119209639"; n16="119209639".encode("utf-16le"); found=any((n in d or n16 in d) for d in (z.read(i.filename) for i in z.infolist() if i.file_size<=30000000)); print("Huawei app id is packaged" if found else ""); sys.exit(0 if found else 1)'

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          NOTES="Android ${{ steps.ver.outputs.version_name }} (versionCode ${{ steps.ver.outputs.version_code }})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app-release.apk --clobber
          else
            gh release create "$TAG" \
              --title "AIMO ${{ steps.ver.outputs.version_name }}" \
              --notes "$NOTES" \
              app-release.apk
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/aimo-release.keystore agconnect-services.json
